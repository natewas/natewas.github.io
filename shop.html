    <!-- Modal Structure -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-gallery" class="modal-gallery"></div>
        </div>
    </div>

    <script>
function openModal(project) {
    console.log('Opening modal for project:', project);
    const modal = document.getElementById('modal');
    const modalGallery = document.getElementById('modal-gallery');

    modalGallery.innerHTML = '';

    const basePath = `./images/${project}/`;
    const totalImages = 10;

    let imageNumber = 1;

    function tryLoadNextImage() {
        if (imageNumber > totalImages) {
            if (modalGallery.children.length === 0) {
                modalGallery.innerHTML = '<p>No images found for this project.</p>';
            }
            return;
        }

        const img = new Image();
        img.src = `${basePath}img${imageNumber}.webp`;
        img.alt = `${project} image`;

        img.onload = () => {
            img.style.width = '100%';
            img.style.marginBottom = '10px';
            modalGallery.appendChild(img);
            imageNumber++;
            tryLoadNextImage(); // Try next one
        };

        img.onerror = () => {
            if (modalGallery.children.length === 0) {
                modalGallery.innerHTML = '<p>No images found for this project.</p>';
            }
            console.warn(`Image not found: ${img.src}`);
            // Stop trying more images after first miss
        };
    }

    tryLoadNextImage();
    modal.style.display = 'flex';
}



function closeModal() {
    const modal = document.getElementById('modal');
    modal.style.display = 'none';
}

    // Close modal when clicking outside content
    window.onclick = function (event) {
        const modal = document.getElementById('modal');
        if (event.target === modal) {
            closeModal();
        }
    };

    </script>

<script>
  // 1) Detect “shop” based on your breadcrumbs
  function isShopContext() {
    const bc = document.querySelector('.breadcrumbs');
    if (!bc) return false;

    // Check visible text
    if ((bc.textContent || '').toLowerCase().includes('shop')) return true;

    // Check hrefs that contain "shop" (case-insensitive)
    return !!bc.querySelector('a[href*="shop" i]');
  }

  // 2) Swap the logo when header is present
  function setLogoForContext() {
    const logoLink = document.querySelector('.logo a');
    if (!logoLink) return;

    if (isShopContext()) {
      // Text version:
      // logoLink.textContent = 'wasdenwoodworks';

      // Image/SVG version (recommended):
      logoLink.innerHTML = 'wasdenwoodworks';
    } else {
      logoLink.textContent = 'natewasden';
    }
  }

  // 3) Load header, mount, then run the swap
  (function loadHeader() {
    const mount = document.getElementById('header-placeholder');
    if (!mount) return;

    fetch('/header.html')
      .then(r => r.text())
      .then(html => {
        mount.innerHTML = html;

        // If .logo is already there, do it now…
        if (document.querySelector('.logo a')) {
          setLogoForContext();
        } else {
          // …otherwise observe just in case header injects more async DOM
          const obs = new MutationObserver(() => {
            if (document.querySelector('.logo a')) {
              setLogoForContext();
              obs.disconnect();
            }
          });
          obs.observe(mount, { childList: true, subtree: true });
        }
      })
      .catch(err => console.error('Error loading header:', err));
  })();
</script>
