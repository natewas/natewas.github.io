<head>

</head>

<body>

    <header class="navbar">
        <div class="logo"><a href="/">natewasden</a></div>
    
        <!-- Hamburger Menu Icon -->
        <div class="menu-toggle" id="menu-toggle">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>        
    
        <nav id="nav-menu">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>

        </nav>

    <script>
// Helper: does this page look like a "shop" page based on breadcrumbs?
function isShopContext() {
  const bc = document.querySelector('.breadcrumbs');
  if (!bc) return false;

  // Match by visible text OR by link hrefs, case-insensitive.
  const text = bc.textContent || '';
  if (text.toLowerCase().includes('shop')) return true;

  return !!bc.querySelector('a[href*="shop" i], li:has(a[href*="shop" i])');
}

// Swap the logo markup
function setLogoForContext() {
  const logoLink = document.querySelector('.logo a');
  if (!logoLink) return;

  if (isShopContext()) {
    // Option A: change text
    // logoLink.textContent = 'NW Shop';

    // Option B: swap to an image (recommended)
    logoLink.innerHTML = '<img src="/images/logo-shop.svg" alt="NW Shop">';
  } else {
    // Default logo (text or your default SVG)
    logoLink.innerHTML = 'natewasden';
  }
}

// Load header, then swap logo once it's in the DOM
fetch('header.html')
  .then(r => r.text())
  .then(html => {
    const mount = document.getElementById('header-placeholder');
    mount.innerHTML = html;

    // If the header injects the .logo immediately, great:
    if (document.querySelector('.logo a')) {
      setLogoForContext();
    } else {
      // Safety net: observe until .logo appears (in case header has async parts)
      const obs = new MutationObserver(() => {
        if (document.querySelector('.logo a')) {
          setLogoForContext();
          obs.disconnect();
        }
      });
      obs.observe(mount, { childList: true, subtree: true });
    }
  })
  .catch(err => console.error('Error loading header:', err));
</script>

    
    

</body>

</html>
